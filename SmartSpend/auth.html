
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSpend | Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-box {
            width: 90%;
            max-width: 420px;
            background: #1e293b;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }

        .tabs button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #334155;
            color: white;
            cursor: pointer;
        }

        .tabs button.active {
            background: #0ea5e9;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0ea5e9;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="auth-box">
    <h1>SmartSpend</h1>
    <p class="subtitle">Manage your money smarter</p>

    <div class="tabs">
        <button id="loginTab" class="active" onclick="showLogin()">Login</button>
        <button id="signupTab" onclick="showSignup()">Sign Up</button>
    </div>

    <form id="authForm">
        <input type="email" id="email" placeholder="Email address" required>
        <input type="password" id="password" placeholder="Password (minimum 6 characters)" minlength="6" required>
        <button class="submit-btn" type="submit" id="submitBtn">Login</button>
    </form>

    <p id="message"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
    let isSignup = false;

    function showLogin() {
        isSignup = false;
        document.getElementById("submitBtn").textContent = "Login";
        document.getElementById("loginTab").classList.add("active");
        document.getElementById("signupTab").classList.remove("active");
        document.getElementById("message").textContent = "";
    }

    function showSignup() {
        isSignup = true;
        document.getElementById("submitBtn").textContent = "Create Account";
        document.getElementById("signupTab").classList.add("active");
        document.getElementById("loginTab").classList.remove("active");
        document.getElementById("message").textContent = "";
    }

    document.getElementById("authForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");
        const submitBtn = document.getElementById("submitBtn");

        message.textContent = "Please wait...";
        submitBtn.disabled = true;

        try {
            if (isSignup) {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) throw error;

                message.textContent = "Account created! Check your email to confirm your account.";
            } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                message.textContent = "Login successful!";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 700);
            }
        } catch (error) {
            message.textContent = error.message;
        }

        submitBtn.disabled = false;
    });
</script>

</body>
</html>
